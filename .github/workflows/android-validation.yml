
name: Android build and runtime validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Gradle
      # --------------------------------------------------
      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      # --------------------------------------------------
      # 4. Android SDK
      # SDK導入は直近の成功設定を維持
      # --------------------------------------------------
      - name: Setup Android SDK manually
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -O tools.zip

          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0"

          echo "Checking Android SDK installation..."

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

          echo "Installed Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Android SDK installation: PASS"

      # --------------------------------------------------
      # 5. Select and extract source ZIP
      # 同じ最新版のZIPが複数ある場合は停止
      # --------------------------------------------------
      - name: Extract latest versioned source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_CANDIDATES < <(
            find . -maxdepth 1 -type f \
              -printf '%f\n' |
              grep -E '^SmartphoneAdvisor_[0-9]+\.[0-9]+\.[0-9]+.*\.zip$' |
              sort -V
          )

          if [ "${#ZIP_CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::No versioned SmartphoneAdvisor ZIP found."
            exit 1
          fi

          echo "Available source ZIP files:"
          printf '%s\n' "${ZIP_CANDIDATES[@]}"

          ZIP_FILE="${ZIP_CANDIDATES[${#ZIP_CANDIDATES[@]}-1]}"

          get_version() {
            sed -E \
              's/^SmartphoneAdvisor_([0-9]+\.[0-9]+\.[0-9]+).*\.zip$/\1/' \
              <<< "$1"
          }

          LATEST_VERSION="$(get_version "$ZIP_FILE")"
          SAME_VERSION_COUNT=0

          for candidate in "${ZIP_CANDIDATES[@]}"; do
            if [ "$(get_version "$candidate")" = "$LATEST_VERSION" ]; then
              SAME_VERSION_COUNT=$((SAME_VERSION_COUNT + 1))
            fi
          done

          if [ "$SAME_VERSION_COUNT" -ne 1 ]; then
            echo "::error::Multiple ZIP files have the latest version $LATEST_VERSION."
            echo "::error::Keep only one ZIP for that version."
            exit 1
          fi

          echo "Selected source ZIP: $ZIP_FILE"
          echo "Selected version: $LATEST_VERSION"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          mapfile -d '' PROJECT_FILES < <(
            find extracted -type f \
              -name settings.gradle.kts \
              -print0
          )

          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one settings.gradle.kts."
            echo "Found: ${#PROJECT_FILES[@]}"
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "${PROJECT_FILES[0]}")"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/tools/run_current_regression_suite.py" ]; then
            echo "::error::Python regression suite is missing."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"
          echo "Source ZIP validation: PASS"

          echo "App build configuration:"
          grep -nE 'compileSdk|minSdk|targetSdk' \
            "$PROJECT_ROOT/app/build.gradle.kts" || true

      # --------------------------------------------------
      # 6. Python regression tests
      # --------------------------------------------------
      - name: Run Python regression suite
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          python3 tools/run_current_regression_suite.py \
            2>&1 | tee "$RUNNER_TEMP/python-regression.log"

      # --------------------------------------------------
      # 7. APK build and JVM unit tests
      # 詳細ログ・スタックトレースを保存
      # --------------------------------------------------
      - name: Build APK and run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          gradle \
            --no-daemon \
            --warning-mode all \
            --stacktrace \
            --info \
            assembleDebug \
            testDebugUnitTest \
            2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      # --------------------------------------------------
      # 8. Show compiler errors when build fails
      # --------------------------------------------------
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          set -u

          {
            echo "## Build failure diagnostics"
            echo ""
            echo "### Kotlin / Gradle error matches"
            echo ""

            if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
              grep -nEi \
                '(^e: |error:|Kotlin compiler error|Compilation error|Location:|Mixing named and positional|FAILED)' \
                "$RUNNER_TEMP/gradle-build.log" |
                tail -n 100 || true

              echo ""
              echo "### Last 120 lines of Gradle log"
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            else
              echo "Gradle log was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # 9. Android emulator tests
      # ビルド成功時のみ実行
      # --------------------------------------------------
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail

            cd "$ANDROID_PROJECT_DIR"

            gradle \
              --no-daemon \
              --warning-mode all \
              --stacktrace \
              connectedDebugAndroidTest

      # --------------------------------------------------
      # 10. Upload APK
      # 全工程成功時のみ保存
      # --------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneAdvisor-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 11. Always upload logs and reports
      # 失敗してもログを残す
      # --------------------------------------------------
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneAdvisor-test-reports
          path: |
            ${{ runner.temp }}/python-regression.log
            ${{ runner.temp }}/gradle-build.log
            extracted/**/build/reports/**
            extracted/**/app/build/reports/**
            extracted/**/app/build/test-results/**
            extracted/**/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
