name: Android build and runtime validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Setup Android SDK manually
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="SmartphoneAdvisor_0.05.05_Gradle9.8.1-compatibility.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Required source ZIP not found: $ZIP_FILE"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_ROOT="$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::settings.gradle.kts not found in source ZIP."
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Run Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          if [ ! -f tools/run_current_regression_suite.py ]; then
            echo "::error::Required Python regression suite is missing."
            exit 1
          fi
          python3 tools/run_current_regression_suite.py

      - name: Build APK and run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --warning-mode all assembleDebug testDebugUnitTest

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            cd "$ANDROID_PROJECT_DIR"
            gradle --no-daemon --warning-mode all connectedDebugAndroidTest

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneAdvisor-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneAdvisor-test-reports
          path: |
            extracted/**/app/build/reports/**
            extracted/**/app/build/test-results/**
            extracted/**/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
