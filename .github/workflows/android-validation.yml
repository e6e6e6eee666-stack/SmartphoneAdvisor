private enum class Screen { HOME, SINGLE_DIAGNOSTIC, SAVED, FAVORITES, BROWSE, OS, BUDGET, USE, GAME, CAMERA, USE_DETAIL, COMMON, BATTERY_CHARGE, SIZE, STORAGE, NICE_HAVE, PURCHASE, CONDITION, DURATION, DESIGN, MUST_HAVE, CONFIRM, RESULT, DETAIL, COMPARE }

/**
 * Some retailer links lead to a general device catalogue rather than a model-specific product page.
 * Keep the button label honest so users know they may need to select the model on the retailer site.
 */
/** Only open explicit web URLs with a real host; DB rows can predate importer validation. */
private fun safeExternalWebUri(rawUrl: String): Uri? {
    val uri = runCatching { Uri.parse(rawUrl.trim()) }.getOrNull() ?: return null
    val scheme = uri.scheme?.lowercase(java.util.Locale.ROOT)
    if (scheme != "https" && scheme != "http") return null
    if (uri.host.isNullOrBlank()) return null
    return uri
}

private fun isGeneralSalesListingUrl(rawUrl: String): Boolean {
    val uri = safeExternalWebUri(rawUrl) ?: return false
    val host = uri.host?.lowercase() ?: return false
    val path = uri.path?.trimEnd('/') ?: return false
    return when (host) {
        "www.apple.com" -> path == "/jp/shop/buy-iphone/iphone-18-pro"
        "mineo.jp" -> path == "/device/smartphone"
        "www.iijmio.jp" -> path == "/device" || path == "/info/iij/1772412502.html"
        // au's official iPhone 18 Pro / Pro Max page is shared by both models.
        "www.au.com" -> path == "/iphone/product/iphone-18-pro"
        "shop.uqmobile.jp" -> path == "/shop/lineup"
        "network.mobile.rakuten.co.jp" -> path == "/product/smartphone"
        "buy.mi.com" -> path == "/jp/products/all"
        "www.ymobile.jp" -> path == "/lineup/simfree"
        "jp.nothing.tech" -> path == "/collections/phones"
        "jp.nubia.com" -> path == "/collections/nubia-z-series"
        // SoftBank's official pages each cover two catalog models, so label them as shared model listings.
        "www.softbank.jp" -> path == "/iphone/iphone-16" || path == "/iphone/iphone-18-pro" || path == "/mobile/products/google-pixel/google-pixel-9-pro"
        // Google Store configuration page is shared by Pixel 11 Pro and Pixel 11 Pro XL.
        "store.google.com" -> path == "/jp/config/pixel_11_pro"
        // ASUS's official Pro page compares both ROG Phone 9 Pro and Pro Edition.
        "rog.asus.com" -> path == "/jp/phones/rog-phone-9-pro"
        else -> false
    }
}

