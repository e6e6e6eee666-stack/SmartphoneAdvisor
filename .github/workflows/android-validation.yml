
name: Android build and runtime validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_ROOT="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Gradle settings file not found in ZIP."
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "platforms;android-35" "build-tools;36.0.0"

      - name: Run Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          if [ -f tools/run_current_regression_suite.py ]; then
            python3 tools/run_current_regression_suite.py
          else
            echo "Python regression suite not found."
          fi

      - name: Build APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          if [ ! -x ./gradlew ]; then
            echo "::error::Gradle wrapper is missing or not executable."
            exit 1
          fi
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            cd "$ANDROID_PROJECT_DIR"
            ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneAdvisor-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneAdvisor-test-reports
          path: |
            extracted/**/app/build/reports/**
            extracted/**/app/build/test-results/**
          if-no-files-found: ignore
