@Composable
private fun SmartphoneAdvisorApp() {
    val context = LocalContext.current
    val scope = rememberCoroutineScope()
    var dbReady by remember { mutableStateOf(false) }
    var catalogImportWarning by remember { mutableStateOf<String?>(null) }
    var startupFailure by remember { mutableStateOf<String?>(null) }
    var startupAttempt by remember { mutableStateOf(0) }
    // Draft state must be declared before any effect that reads/writes it.
    var hasDiagnosticDraft by remember { mutableStateOf(false) }
    var draftLoaded by rememberSaveable { mutableStateOf(false) }
    LaunchedEffect(startupAttempt) {
        val initializationOutcome = runCatching {
            withContext(Dispatchers.IO) {
            // JSONカタログ読込も失敗経路として扱い、失敗時に初期化全体を止めない。
            // 既存Room/Seedデータで起動を続けつつ、最新カタログ未反映を利用者に知らせる。
            val catalogLoadOutcome = runCatching {
                PhoneCatalogJsonLoader.load(context).also { catalog ->
                    check(catalog.phones.isNotEmpty()) { "phones.json contains no phone models" }
                    check(catalog.phones.sumOf { phone -> phone.variants.sumOf { it.sales.size } } > 0) {
                        "phones.json contains no sales listings"
                    }
                }
            }
            val jsonCatalog = catalogLoadOutcome.getOrNull()
            if (jsonCatalog == null) {
                val error = catalogLoadOutcome.exceptionOrNull()
                Log.e("SmartphoneAdvisorCatalog", "Catalog JSON load/validation failed; existing seed retained", error)
                withContext(Dispatchers.Main) {
                    catalogImportWarning = "最新カタログの読み込みに失敗しました。既存データで起動を続けますが、最新の機種・販売情報が反映されていない可能性があります。phones.json の内容と読み込みエラーを確認してください。"
                }
            }
            val database = AppDatabase.getInstance(context)
            SeedData.ensureSeeded(database)
            runCatching {
                val report = RetailerMasterAudit.analyze(database.phoneDao().getAllRetailersForAudit())
                Log.i("SmartphoneAdvisorRetailerAudit", "read-only retailer audit: rows=${report.totalRows}, blankNames=${report.blankNames}, duplicateNames=${report.duplicateNames.size}, mixedTypes=${report.mixedTypes.size}, mixedOfficialFlags=${report.mixedOfficialFlags.size}, normalizedNameVariants=${report.normalizedNameVariants.size}, mixedWebsiteUrls=${report.mixedWebsiteUrls.size}, invalidWebsiteUrls=${report.invalidWebsiteUrls.size}, whitespaceWebsiteUrls=${report.whitespaceWebsiteUrls.size}")
                report.duplicateNames.entries.take(50).forEach { (name, count) -> Log.w("SmartphoneAdvisorRetailerAudit", "duplicate retailer name '$name': $count rows") }
                report.mixedTypes.entries.take(50).forEach { (name, types) -> Log.w("SmartphoneAdvisorRetailerAudit", "retailer '$name' has mixed types: ${types.sorted()}") }
                report.mixedOfficialFlags.entries.take(50).forEach { (name, flags) -> Log.w("SmartphoneAdvisorRetailerAudit", "retailer '$name' has mixed official flags: ${flags.sorted()}") }
                report.normalizedNameVariants.entries.take(50).forEach { (key, names) -> Log.w("SmartphoneAdvisorRetailerAudit", "normalized retailer-name collision '$key': ${names.sorted()}") }
                report.mixedWebsiteUrls.entries.take(50).forEach { (key, urls) -> Log.w("SmartphoneAdvisorRetailerAudit", "normalized retailer name '$key' has multiple website URLs: ${urls.sorted()}") }
                report.invalidWebsiteUrls.entries.take(50).forEach { (id, url) -> Log.w("SmartphoneAdvisorRetailerAudit", "retailer id=$id has invalid website URL: '$url'") }
                report.whitespaceWebsiteUrls.entries.take(50).forEach { (id, url) -> Log.w("SmartphoneAdvisorRetailerAudit", "retailer id=$id has whitespace around website URL: '$url'") }
            }.onFailure { error -> Log.e("SmartphoneAdvisorRetailerAudit", "Read-only retailer audit failed", error) }
            if (jsonCatalog != null) {
                val importOutcome = runCatching { PhoneCatalogRoomImporter.importCatalog(database, jsonCatalog) }
                importOutcome.onSuccess { result ->
                    Log.i("SmartphoneAdvisorCatalog", "JSON-to-Room import: modelsInserted=${result.modelsInserted}, modelsReused=${result.modelsReused}, variantsInserted=${result.variantsInserted}, variantsReused=${result.variantsReused}, salesVariantsInserted=${result.salesVariantsInserted}, salesVariantsReused=${result.salesVariantsReused}, retailersInserted=${result.retailersInserted}, retailersReused=${result.retailersReused}, listingsInserted=${result.listingsInserted}, listingsReused=${result.listingsReused}, listingsSkippedNoUrl=${result.listingsSkippedNoUrl}, conflicts=${result.conflicts.size}, skippedNonOfficial=${result.skippedNonOfficial}")
                    result.conflicts.take(50).forEach { Log.w("SmartphoneAdvisorCatalog", it) }
                    if (result.conflicts.isNotEmpty()) {
                        withContext(Dispatchers.Main) {
                            catalogImportWarning = "カタログ取込で ${result.conflicts.size} 件の競合が見つかりました。すべての機種データが登録されたとは限りません。詳細はログの SmartphoneAdvisorCatalog を確認してください。"
                        }
                    }
                }
                importOutcome.exceptionOrNull()?.let { error ->
                    Log.e("SmartphoneAdvisorCatalog", "Catalog import failed; existing seed retained", error)
                    withContext(Dispatchers.Main) {
                        catalogImportWarning = "最新カタログの取り込みに失敗しました。既存データで起動を続けますが、最新の機種・販売情報が反映されていない可能性があります。詳細はログの SmartphoneAdvisorCatalog を確認してください。"
                    }
                }
            }
            runCatching {
                val dao = database.phoneDao()
                val relationReport = ProductListingRelationAudit.analyze(
                    deviceVariants = dao.getAllDeviceVariantsForAudit(),
                    salesVariants = dao.getAllSalesVariantsForAudit(),
                    retailers = dao.getAllRetailersForAudit(),
                    listings = dao.getAllProductListingsForAudit(),
                    prices = dao.getAllPriceRecordsV2ForAudit()
                )
                Log.i("SmartphoneAdvisorListingAudit", "read-only relation audit: issueGroups=${relationReport.issueGroupCount}, issueRowIncidences=${relationReport.issueRowCount}, salesVariants=${relationReport.salesVariantRows}, listings=${relationReport.productListingRows}, prices=${relationReport.priceRecordRows}, missingDeviceVariants=${relationReport.salesVariantsMissingDeviceVariant.size}, listingsMissingSalesVariant=${relationReport.listingsMissingSalesVariant.size}, listingsMissingRetailer=${relationReport.listingsMissingRetailer.size}, blankProductUrls=${relationReport.blankProductUrls.size}, duplicateListingIdentityGroups=${relationReport.duplicateListingIdentities.size}, duplicateSalesVariantIdentityGroups=${relationReport.duplicateSalesVariantIdentities.size}, pricesMissingListing=${relationReport.priceRecordsMissingListing.size}")
                relationReport.salesVariantsMissingDeviceVariant.entries.take(50).forEach { (id, variantId) -> Log.w("SmartphoneAdvisorListingAudit", "sales variant id=$id references missing device variant id=$variantId") }
                relationReport.listingsMissingSalesVariant.entries.take(50).forEach { (id, salesId) -> Log.w("SmartphoneAdvisorListingAudit", "product listing id=$id references missing sales variant id=$salesId") }
                relationReport.listingsMissingRetailer.entries.take(50).forEach { (id, retailerId) -> Log.w("SmartphoneAdvisorListingAudit", "product listing id=$id references missing retailer id=$retailerId") }
                relationReport.blankProductUrls.entries.take(50).forEach { (id, retailerId) -> Log.w("SmartphoneAdvisorListingAudit", "product listing id=$id has blank URL (retailer id=$retailerId)") }
                relationReport.duplicateListingIdentities.entries.take(50).forEach { (identity, count) -> Log.w("SmartphoneAdvisorListingAudit", "duplicate product listing identity $identity: $count rows") }
                relationReport.duplicateSalesVariantIdentities.entries.take(50).forEach { (identity, count) -> Log.w("SmartphoneAdvisorListingAudit", "duplicate sales variant identity $identity: $count rows") }
                relationReport.priceRecordsMissingListing.entries.take(50).forEach { (id, listingId) -> Log.w("SmartphoneAdvisorListingAudit", "price record v2 id=$id references missing product listing id=$listingId") }
            }.onFailure { error -> Log.e("SmartphoneAdvisorListingAudit", "Read-only product-listing relation audit failed", error) }
            }
        }
        initializationOutcome.onSuccess {
            startupFailure = null
            dbReady = true
        }.onFailure { error ->
            Log.e("SmartphoneAdvisorStartup", "Application initialization failed before database became ready", error)
            dbReady = false
            catalogImportWarning = null
            startupFailure = "アプリの初期化を完了できませんでした。データベースや初期データの状態を確認してください。再試行しても解決しない場合は、このエラー画面を閉じずに開発担当者へ連絡してください。（原因: ${error.javaClass.simpleName}）"
        }
    }
    LaunchedEffect(dbReady) {
        if (dbReady && !draftLoaded) {
            val draftOutcome = runCatching {
                withContext(Dispatchers.IO) { AppDatabase.getInstance(context).diagnosticDao().getDraft() }
            }
            draftOutcome.onSuccess { draft ->
                hasDiagnosticDraft = draft != null
                draftLoaded = true
            }.onFailure { error ->
                Log.e("SmartphoneAdvisorStartup", "Saved diagnostic draft load failed", error)
                startupFailure = "保存済み診断の読み込みに失敗しました。データベースを確認して初期化を再試行してください。（原因: ${error.javaClass.simpleName}）"
                dbReady = false
            }
        }
    }
    var screen by rememberSaveable { mutableStateOf(Screen.HOME) }
    var os by rememberSaveable { mutableStateOf<CandidateOs?>(null) }
    var budgetTarget by rememberSaveable { mutableStateOf("") }
    var budgetMax by rememberSaveable { mutableStateOf("") }
    var primaryUse by rememberSaveable { mutableStateOf<PrimaryUse?>(null) }
    var gameType by rememberSaveable { mutableStateOf<String?>(null) }
    var cameraSubject by rememberSaveable { mutableStateOf<String?>(null) }
    var battery by rememberSaveable { mutableStateOf<String?>(null) }
    var batteryCharge by rememberSaveable { mutableStateOf<String?>(null) }
    var sizePreference by rememberSaveable { mutableStateOf<String?>(null) }
    var storageMinimum by rememberSaveable { mutableStateOf<String?>(null) }
    var niceHave by rememberSaveable { mutableStateOf<List<String>>(emptyList()) }
    var purchaseChannel by rememberSaveable { mutableStateOf<String?>(null) }
    var productCondition by rememberSaveable { mutableStateOf<String?>(null) }
    var intendedYears by rememberSaveable { mutableStateOf<String?>(null) }
    var designPreference by rememberSaveable { mutableStateOf<String?>(null) }
    var useDetail by rememberSaveable { mutableStateOf<String?>(null) }
    var mustHave by rememberSaveable { mutableStateOf<List<String>>(emptyList()) }
    var recommendationResults by remember { mutableStateOf<List<RecommendationResult>>(emptyList()) }
    var recommendationPrioritySummary by remember { mutableStateOf<List<String>>(emptyList()) }
    var noCandidateExplanation by remember { mutableStateOf<List<String>>(emptyList()) }
    var saveMessage by remember { mutableStateOf<String?>(null) }
    var editingProfileId by rememberSaveable { mutableStateOf<Long?>(null) }
    var diagnosticRunToken by rememberSaveable { mutableStateOf(0) }
    var lastRecordedRunToken by rememberSaveable { mutableStateOf(0) }
    var renameProfileId by rememberSaveable { mutableStateOf<Long?>(null) }
    var renameProfileText by rememberSaveable { mutableStateOf("") }
    var selectedDeviceId by rememberSaveable { mutableStateOf<Long?>(null) }
    var detailReturnScreen by rememberSaveable { mutableStateOf(Screen.HOME) }
    var selectedDeviceDetail by remember { mutableStateOf<PhoneDetailRow?>(null) }
    var purchaseOptions by remember { mutableStateOf<List<PurchaseOptionRow>>(emptyList()) }
    var dataConflicts by remember { mutableStateOf<List<DataConflictEntity>>(emptyList()) }
    var comparisonIds by rememberSaveable { mutableStateOf<List<Long>>(emptyList()) }
    var comparisonItems by remember { mutableStateOf<List<ComparisonRow>>(emptyList()) }
    var comparisonPrices by remember { mutableStateOf<List<ComparisonPriceRow>>(emptyList()) }
    var browseQuery by rememberSaveable { mutableStateOf("") }
    var browseOs by rememberSaveable { mutableStateOf(CandidateOs.EITHER) }
    var browseManufacturer by rememberSaveable { mutableStateOf("すべて") }
    var browseSeries by rememberSaveable { mutableStateOf("すべて") }
    var browseMaxPrice by rememberSaveable { mutableStateOf(0) }
    var browseStorage by rememberSaveable { mutableStateOf(0) }
    var browseReleaseYear by rememberSaveable { mutableStateOf(0) }
    var browseItems by remember { mutableStateOf<List<jp.smartphoneadvisor.app.data.PhoneListRow>>(emptyList()) }
    var favoriteItems by remember { mutableStateOf<List<jp.smartphoneadvisor.app.data.PhoneListRow>>(emptyList()) }
    // Do not touch Room during composition until the guarded startup path has succeeded.
    // Otherwise a database-construction failure can throw here before startupFailure is shown.
    val favoriteDeviceIdsFlow = remember(dbReady, context) {
        if (dbReady) AppDatabase.getInstance(context).phoneDao().observeFavoriteDeviceIds()
        else flowOf(emptyList<Long>())
    }
    val favoriteDeviceIds by favoriteDeviceIdsFlow.collectAsState(initial = emptyList())
    val diagnosticProfilesFlow = remember(dbReady, context) {
        if (dbReady) AppDatabase.getInstance(context).diagnosticDao().observeProfiles()
        else flowOf(emptyList<jp.smartphoneadvisor.app.data.DiagnosticProfileEntity>())
    }
    val diagnosticProfiles by diagnosticProfilesFlow.collectAsState(initial = emptyList())

    BackHandler(enabled = screen != Screen.HOME) {
        screen = when (screen) {
            Screen.DETAIL -> detailReturnScreen
            Screen.COMPARE -> Screen.RESULT
            Screen.SINGLE_DIAGNOSTIC -> Screen.HOME
            Screen.FAVORITES, Screen.BROWSE, Screen.SAVED -> Screen.HOME
            Screen.OS -> Screen.HOME
            Screen.BUDGET -> Screen.OS
            Screen.USE -> Screen.BUDGET
            Screen.GAME, Screen.CAMERA, Screen.USE_DETAIL -> Screen.USE
            Screen.COMMON -> Screen.USE
            Screen.BATTERY_CHARGE -> Screen.COMMON
            Screen.SIZE -> Screen.BATTERY_CHARGE
            Screen.STORAGE -> Screen.SIZE
            Screen.NICE_HAVE -> Screen.STORAGE
            Screen.PURCHASE -> Screen.NICE_HAVE
            Screen.CONDITION -> Screen.PURCHASE
            Screen.DURATION -> Screen.CONDITION
            Screen.DESIGN -> Screen.DURATION
            Screen.MUST_HAVE -> Screen.DESIGN
            Screen.CONFIRM -> Screen.MUST_HAVE
            Screen.RESULT -> Screen.CONFIRM
            Screen.HOME -> Screen.HOME
        }
    }

    fun activeGameType(): String = if (primaryUse == PrimaryUse.GAMING) gameType.orEmpty() else ""
    fun activeCameraSubject(): String = if (primaryUse == PrimaryUse.CAMERA) cameraSubject.orEmpty() else ""
    fun activeUseDetail(): String = when (primaryUse) {
        PrimaryUse.VIDEO, PrimaryUse.SNS, PrimaryUse.WORK, PrimaryUse.AI, PrimaryUse.VIDEO_EDITING -> useDetail.orEmpty()
        else -> ""
    }

    LaunchedEffect(screen, os, dbReady, budgetTarget, budgetMax, primaryUse, mustHave, battery, purchaseChannel, diagnosticRunToken) {
        if (screen == Screen.RESULT && dbReady && os != null && primaryUse != null) {
            val maxPrice = budgetMax.toYenOrNull()
            val targetPrice = budgetTarget.toYenOrNull()
            val requiredFeatures = mustHave.mapNotNull(::featureFromLabel).toSet()
            val batteryImportance = when (battery) {
                "あまり気にしない" -> 0
                "かなり重要" -> 2
                "最重要" -> 3
                else -> 1
            }
            val rows = withContext(Dispatchers.IO) {
                AppDatabase.getInstance(context).phoneDao().searchJapanOfficialDevices(
                    os!!.name, "", purchaseChannel.orEmpty().toSalesChannelDbValue()
                )
            }
            val storageMinimumGb = when (storageMinimum) {
                "128GB以上" -> 128
                "256GB以上" -> 256
                "512GB以上" -> 512
                "1TB以上" -> 1024
                else -> null
            }
            val requirement = jp.smartphoneadvisor.app.domain.UserRequirement(
                os = os!!,
                budget = BudgetRequirement(targetPrice, maxPrice),
                primaryUse = primaryUse!!,
                gameType = if (primaryUse == PrimaryUse.GAMING) gameType else null,
                cameraSubject = if (primaryUse == PrimaryUse.CAMERA) cameraSubject else null,
                useDetail = if (primaryUse == PrimaryUse.VIDEO || primaryUse == PrimaryUse.SNS || primaryUse == PrimaryUse.WORK || primaryUse == PrimaryUse.AI || primaryUse == PrimaryUse.VIDEO_EDITING) useDetail else null,
                batteryImportance = batteryImportance,
                batteryChargePreference = batteryCharge,
                sizePreference = sizePreference,
                storageMinimumGb = storageMinimumGb,
                niceHaveFeatures = niceHave.toSet(),
                purchaseChannel = purchaseChannel,
                productConditionPreference = productCondition,
                intendedUseYears = intendedYears.toIntOrNullFromLabel(),
                designPreference = designPreference,
                mustHaveFeatures = requiredFeatures
            )
            val results = RecommendationEngine.recommend(
                requirement = requirement,
                candidates = rows,
                limit = 3
            )
            recommendationResults = results
            recommendationPrioritySummary = RecommendationEngine.prioritySummary(requirement)
            noCandidateExplanation = if (results.isEmpty()) {
                RecommendationEngine.explainNoCandidates(requirement, rows).reasons +
                    RecommendationEngine.exclusionReasonSummary(requirement, rows)
            } else {
                emptyList()
            }
            if (diagnosticRunToken > lastRecordedRunToken && editingProfileId != null) {
                val runAt = System.currentTimeMillis()
                withContext(Dispatchers.IO) {
                    val dao = AppDatabase.getInstance(context).diagnosticDao()
                    dao.markRun(editingProfileId!!, runAt)
                    dao.insertRun(
                        jp.smartphoneadvisor.app.data.DiagnosticRunEntity(
                            profileId = editingProfileId!!,
                            executedAt = runAt,
                            databaseVersion = "0.2.27",
                            requirementSnapshot = buildRequirementSnapshot(
                                os, budgetTarget, budgetMax, primaryUse, gameType, cameraSubject, useDetail, battery, batteryCharge,
                                sizePreference, storageMinimum, niceHave, purchaseChannel, productCondition, intendedYears,
                                designPreference, mustHave
                            ),
                            recommendedDeviceIds = results.joinToString(",") { it.phone.deviceVariantId.toString() },
                            excludedDeviceIds = rows.filter { candidate -> results.none { it.phone.deviceVariantId == candidate.deviceVariantId } }
                                .joinToString(",") { it.deviceVariantId.toString() }
                        )
                    )
                }
                lastRecordedRunToken = diagnosticRunToken
            }
        }
    }

    LaunchedEffect(screen, selectedDeviceId, dbReady) {
        if (screen == Screen.DETAIL && dbReady && selectedDeviceId != null) {
            withContext(Dispatchers.IO) {
                val dao = AppDatabase.getInstance(context).phoneDao()
                selectedDeviceDetail = dao.getDeviceDetail(selectedDeviceId!!)
                purchaseOptions = dao.getPurchaseOptions(selectedDeviceId!!)
                dataConflicts = dao.getOpenDataConflicts(selectedDeviceId!!)
            }
        }
    }

    LaunchedEffect(screen, comparisonIds, dbReady) {
        if (screen == Screen.COMPARE && dbReady) {
            val loaded = withContext(Dispatchers.IO) {
                val dao = AppDatabase.getInstance(context).phoneDao()
                dao.getComparisonItems(comparisonIds) to dao.getComparisonPrices(comparisonIds)
            }
            comparisonItems = loaded.first
            comparisonPrices = loaded.second
        }
    }

    LaunchedEffect(screen, favoriteDeviceIds, dbReady) {
        if (screen == Screen.FAVORITES && dbReady) {
            val all = withContext(Dispatchers.IO) {
                AppDatabase.getInstance(context).phoneDao().searchJapanOfficialDevices(CandidateOs.EITHER.name, "")
            }
            favoriteItems = all.filter { it.deviceVariantId in favoriteDeviceIds }
        }
    }

    LaunchedEffect(screen, browseQuery, browseOs, dbReady) {
        if (screen == Screen.BROWSE && dbReady) {
            browseItems = withContext(Dispatchers.IO) {
                AppDatabase.getInstance(context).phoneDao().searchJapanOfficialDevices(
                    browseOs.name, browseQuery.trim()
                )
            }
        }
    }

    fun addToComparison(deviceId: Long) {
        if (deviceId !in comparisonIds && comparisonIds.size < 5) {
            comparisonIds = comparisonIds + deviceId
        }
    }

    fun currentDiagnosticAnswers(): List<Pair<String, String>> = listOf(
        "os" to (os?.name ?: ""),
        "budget_target" to budgetTarget,
        "budget_max" to budgetMax,
        "primary_use" to (primaryUse?.name ?: ""),
        "game_type" to activeGameType(),
        "camera_subject" to activeCameraSubject(),
        "battery" to (battery ?: ""),
        "battery_charge" to (batteryCharge ?: ""),
        "size_preference" to (sizePreference ?: ""),
        "storage_minimum" to (storageMinimum ?: ""),
        "nice_have" to niceHave.joinToString(","),
        "purchase_channel" to (purchaseChannel ?: ""),
        "product_condition" to (productCondition ?: ""),
        "intended_years" to (intendedYears ?: ""),
        "design_preference" to (designPreference ?: ""),
        "use_detail" to (useDetail ?: ""),
        "must_have" to mustHave.joinToString(",")
    )

    fun draftPayload(): String = JSONObject().apply {
        put("os", os?.name ?: "")
        put("budget_target", budgetTarget)
        put("budget_max", budgetMax)
        put("primary_use", primaryUse?.name ?: "")
        put("game_type", activeGameType())
        put("camera_subject", activeCameraSubject())
        put("battery", battery ?: "")
        put("battery_charge", batteryCharge ?: "")
        put("size_preference", sizePreference ?: "")
        put("storage_minimum", storageMinimum ?: "")
        put("nice_have", niceHave.joinToString("\u001f"))
        put("purchase_channel", purchaseChannel ?: "")
        put("product_condition", productCondition ?: "")
        put("intended_years", intendedYears ?: "")
        put("design_preference", designPreference ?: "")
        put("use_detail", activeUseDetail())
        put("must_have", mustHave.joinToString("\u001f"))
        put("screen", screen.name)
    }.toString()

    fun restorePayload(payload: String, destination: Screen = Screen.OS) {
        val json = runCatching { JSONObject(payload) }.getOrNull() ?: return
        fun value(key: String) = json.optString(key, "").takeIf { it.isNotBlank() }
        os = value("os")?.let { runCatching { CandidateOs.valueOf(it) }.getOrNull() }
        budgetTarget = json.optString("budget_target", "")
        budgetMax = json.optString("budget_max", "")
        primaryUse = value("primary_use")?.let { runCatching { PrimaryUse.valueOf(it) }.getOrNull() }
        gameType = value("game_type").takeIf { primaryUse == PrimaryUse.GAMING }
        cameraSubject = value("camera_subject").takeIf { primaryUse == PrimaryUse.CAMERA }
        battery = value("battery"); batteryCharge = value("battery_charge")
        sizePreference = value("size_preference"); storageMinimum = value("storage_minimum")
        niceHave = json.optString("nice_have", "").split("\u001f").filter { it.isNotBlank() }
        purchaseChannel = value("purchase_channel"); productCondition = value("product_condition")
        intendedYears = value("intended_years"); designPreference = value("design_preference")
        useDetail = value("use_detail").takeIf {
            primaryUse in setOf(PrimaryUse.VIDEO, PrimaryUse.SNS, PrimaryUse.WORK, PrimaryUse.AI, PrimaryUse.VIDEO_EDITING)
        }
        mustHave = json.optString("must_have", "").split("\u001f").filter { it.isNotBlank() }
        screen = destination
    }

    LaunchedEffect(
        dbReady, screen, os, budgetTarget, budgetMax, primaryUse, gameType, cameraSubject, battery,
        batteryCharge, sizePreference, storageMinimum, niceHave, purchaseChannel, productCondition,
        intendedYears, designPreference, useDetail, mustHave
    ) {
        if (dbReady && screen != Screen.HOME && screen != Screen.RESULT && screen != Screen.SAVED && screen != Screen.FAVORITES && screen != Screen.BROWSE && screen != Screen.DETAIL && screen != Screen.COMPARE && os != null) {
            withContext(Dispatchers.IO) {
                AppDatabase.getInstance(context).diagnosticDao().upsertDraft(
                    jp.smartphoneadvisor.app.data.DiagnosticDraftEntity(
                        payload = draftPayload(),
                        updatedAt = System.currentTimeMillis()
                    )
                )
            }
            hasDiagnosticDraft = true
        }
    }

    suspend fun clearDiagnosticDraft() {
        AppDatabase.getInstance(context).diagnosticDao().clearDraft()
        withContext(Dispatchers.Main) { hasDiagnosticDraft = false }
    }

    suspend fun saveCurrentDiagnosis() {
        val dao = AppDatabase.getInstance(context).diagnosticDao()
        val now = System.currentTimeMillis()
        val existingId = editingProfileId
        val targetProfileId: Long
        if (existingId != null) {
            val existing = dao.getProfile(existingId)
            if (existing == null || !existing.isActive) {
                saveMessage = "保存先の診断が見つかりません。"
                return
            }
            targetProfileId = dao.upsertProfile(existing.copy(updatedAt = now, lastRunAt = now))
        } else {
            val activeCount = dao.activeProfileCount()
            if (activeCount >= 3) {
                saveMessage = "保存できる診断は3件までです。"
                return
            }
            targetProfileId = dao.upsertProfile(
                jp.smartphoneadvisor.app.data.DiagnosticProfileEntity(
                    name = "診断 ${activeCount + 1}",
                    createdAt = now,
                    updatedAt = now,
                    lastRunAt = now
                )
            )
        }
        dao.deleteAnswers(targetProfileId)
        currentDiagnosticAnswers().forEach { (questionId, value) ->
            dao.upsertAnswer(
                jp.smartphoneadvisor.app.data.DiagnosticAnswerEntity(
                    profileId = targetProfileId,
                    questionId = questionId,
                    answerValue = value
                )
            )
        }
        if (existingId == null) {
            editingProfileId = targetProfileId
            dao.insertRun(
                jp.smartphoneadvisor.app.data.DiagnosticRunEntity(
                    profileId = targetProfileId,
                    executedAt = now,
                    databaseVersion = "0.2.27",
                    requirementSnapshot = buildRequirementSnapshot(
                        os, budgetTarget, budgetMax, primaryUse, gameType, cameraSubject, useDetail, battery, batteryCharge,
                                sizePreference, storageMinimum, niceHave, purchaseChannel, productCondition, intendedYears,
                                designPreference, mustHave
                    ),
                    recommendedDeviceIds = recommendationResults.joinToString(",") { it.phone.deviceVariantId.toString() },
                    excludedDeviceIds = ""
                )
            )
        }
        saveMessage = if (existingId == null) "診断を保存しました。" else "保存した診断を更新しました。"
    }

    fun restoreDiagnostic(profileId: Long, runLatest: Boolean) {
        scope.launch(Dispatchers.IO) {
            val answers = AppDatabase.getInstance(context).diagnosticDao().getAnswers(profileId)
            val values = answers.associate { it.questionId to it.answerValue }
            withContext(Dispatchers.Main) {
                editingProfileId = profileId
                os = values["os"]?.takeIf { it.isNotBlank() }?.let { runCatching { CandidateOs.valueOf(it) }.getOrNull() }
                budgetTarget = values["budget_target"]
